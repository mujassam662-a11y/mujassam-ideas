", "shot": "الشحنة بتتسلّم لمندوب Bosta (أو بتتحط في كيس الشحن). بعدها لقطة لموبايل عليه صفحة التتبع. بيانات العنوان متغطية."}, {"time": "33-40 ث", "say": "ارفع ملفك على mujassam.net وشوف السعر.", "on_screen": "ارفع ملفك على mujassam.net", "shot": "لقطة أخيرة للقطعة الجاهزة جنب الكرتونة. بعدها شاشة موبايل على صفحة رفع الملف في mujassam.net، واللوجو بألوان البراند (كحلي وبرتقالي)."}]}}, {"id": 20, "platform": "إنستجرام", "format": "ستوري", "title": "ممكن لينك الموقع؟ الرد جاهز في ستوري واحدة", "summary": "كتير بيسألونا على لينك موقع طباعة 3d، فجمعنا الرد في ستوري واحدة.", "date": "2026-11-07", "script": {"hook": "كتير بيسألونا على لينك موقع طباعة 3d، فجمعنا الرد في ستوري واحدة.", "caption": "لينك موقع طباعة 3d اللي كتير بيسألوا عليه موجود في الستوري دي. ارفع ملفك على الموقع وشوف السعر قدامك قبل ما تدفع. ثبتناها في الهايلايت عشان تلاقيها كل ما تحتاجها.", "hashtags": ["#طباعة_3d_مصر", "#مجسم", "#طباعة_3d_اونلاين"], "scenes": [{"time": "0-3 ث", "say": "كتير بيسألونا على لينك موقع طباعة 3d، فجمعنا الرد في ستوري واحدة.", "on_screen": "لينك موقع طباعة 3d", "shot": "لقطة سيلفي قريبة لصاحب النشاط في الورشة وبيتكلم للكاميرا. وراه طابعة شغالة بشكل طبيعي. التصوير موبايل عمودي 9:16."}, {"time": "3-9 ث", "say": "افتح اللينك اللي تحت وهتلاقي صفحة الرفع. بتحط الملف بتاعك هناك وبعدها كل حاجة بتبقى قدامك.", "on_screen": "افتح اللينك وابدأ", "shot": "تسجيل شاشة حقيقي من موبايل لصفحة الرفع في mujassam.net. إصبع بيضغط على اختيار الملف وبيرفع ملف STL. نحط ستيكر اللينك على الشاشة في الجنب."}, {"time": "9-14 ث", "say": "بتشوف القطعة 3D قدامك، وبتختار الخامة واللون، والسعر بيظهر وإنت لسه ما دفعتش.", "on_screen": "شوف السعر قبل الدفع", "shot": "نكمل تسجيل الشاشة: معاينة القطعة 3D، ثم اختيار الخامة واللون، ثم ظهور السعر النهائي. من غير ما نركز على رقم معين."}, {"time": "14-18 ث", "say": "يعني لو معاك ملفك، ارفع ملف STL واعرف السعر، والباقي علينا.", "on_screen": "ارفع ملفك وشوف السعر", "shot": "رجوع للسيلفي: صاحب النشاط بيشاور على ستيكر اللينك تحت. بعدها شاشة ختامية بألوان البراند (كحلي وبرتقالي) فيها زرار «ارفع ملفك». نثبّت الستوري في الهايلايت عشان تبقى الرد الجاهز."}]}}, {"id": 19, "platform": "تيك توك", "format": "فيديو قصير", "title": "هل الخامة دي تتحمل الحرارة؟ جاوب قبل ما تطلب", "summary": "هتطبع قطعة هتفضل في مكان دافي، وتايه بين PLA ولا PETG؟ اسمع دي قبل ما تطلب.", "date": "2026-11-07", "script": {"hook": "هتطبع قطعة هتفضل في مكان دافي، وتايه بين PLA ولا PETG؟ اسمع دي قبل ما تطلب.", "caption": "PLA ولا PETG؟ الاختيار بيبدأ من المكان اللي القطعة هتتحط فيه. PLA للديكور والنماذج، وPETG أنسب للقطع اللي هتتعرض لظروف أصعب. ارفع ملف STL واختار الخامة بنفسك وشوف السعر النهائي قبل الدفع.", "hashtags": ["#طباعة_3d_اونلاين", "#طباعة_3d_مصر", "#مجسم"], "scenes": [{"time": "0-3 ث", "say": "هتطبع قطعة هتفضل في مكان دافي، وتايه بين PLA ولا PETG؟ اسمع دي قبل ما تطلب.", "on_screen": "PLA ولا PETG؟", "shot": "لقطة قريبة على ترابيزة: نفس القطعة مطبوعة مرتين، واحدة PLA وواحدة PETG، وإيد صاحب الشغل بتشاور عليهم. من غير أي مؤثرات."}, {"time": "3-12 ث", "say": "كتير بيسألونا: الخامة دي هتستحمل الحرارة؟ الحقيقة إن الخامتين مش زي بعض. الـ PLA خامة سهلة وألوانها حلوة، ممتازة للديكور والنماذج، بس مش اللي تحطها في مكان حرارته عالية.", "on_screen": "PLA: للديكور والنماذج", "shot": "الكاميرا تقرّب على قطعة الـ PLA وهي في إيده، وبعدها لقطة سريعة لقطعة ديكور مطبوعة على رف."}, {"time": "12-24 ث", "say": "أما الـ PETG فأقوى وأنسب للقطع اللي هتشتغل واتعرض لظروف أصعب، زي الاستخدام الخارجي أو القطع الميكانيكية. فلو قطعتك مكانها هيبقى دافي أو برّه، ابدأ بالـ PETG.", "on_screen": "PETG: للظروف الأصعب", "shot": "قطعة الـ PETG في إيده، وبعدها لقطة لها وهي متركّبة أو متحطة في مكان بره، زي حامل على شباك أو قطعة على عربية. القطعة بتتصوّر بجد، من غير أي اختبار حرارة."}, {"time": "24-34 ث", "say": "والحلو إنك مش محتاج تسأل حد: بترفع الملف على الموقع، وتختار الخامة بنفسك، وتشوف السعر النهائي قبل ما تدفع.", "on_screen": "اختار الخامة وشوف السعر", "shot": "تسجيل شاشة حقيقي لموقع mujassam.net: رفع ملف STL، معاينة الـ 3D، تغيير الخامة بين PLA وPETG، وظهور السعر. من غير ما يظهر أي نسبة خصم."}, {"time": "34-40 ث", "say": "فكّر القطعة هتتحط فين، واختار الخامة على الأساس ده. وارفع ملفك من اللينك اللي في البايو.", "on_screen": "ارفع ملفك من البايو", "shot": "لقطة أخيرة للقطعتين جنب بعض ولوجو مجسّم بالكحلي والبرتقالي."}]}}, {"id": 18, "platform": "يوتيوب", "format": "فيديو طويل", "title": "طلب حقيقي من الرفع لحد باب البيت", "summary": "النهارده هنمشي ورا طلب طباعة 3d اونلاين وشحن بوسطة، من أول ما الملف يترفع لحد ما الكرتونة توصل باب البيت.", "date": "2026-11-07", "script": {"hook": "النهارده هنمشي ورا طلب طباعة 3d اونلاين وشحن بوسطة، من أول ما الملف يترفع لحد ما الكرتونة توصل باب البيت.", "caption": "طباعة 3d اونلاين وشحن بوسطة، تابعنا فيها طلب حقيقي من لحظة رفع الملف لحد ما القطعة وصلت باب البيت. شوفنا السعر، والدفع، والطباعة والفحص والتغليف، وبعدها تتبع بوسطة وفتح الكرتونة. لو عندك ملف STL، ارفعه على mujassam.net وشوف السعر النهائي قبل الدفع.", "hashtags": ["#طباعة_3d_اونلاين", "#طباعة_3d_مصر", "#مجسم", "#مجسمات_3d"], "scenes": [{"time": "0:00-0:20", "say": "النهارده هنمشي ورا طلب طباعة 3d اونلاين وشحن بوسطة، من أول ما الملف يترفع لحد ما الكرتونة توصل باب البيت. الطلب ده حقيقي، وصاحبه وافق نصوره، وأنا مش هتدخل فيه ولا هقول لحد يستنى. هنشوف إيه اللي بيحصل في كل خطوة.", "on_screen": "طباعة 3d اونلاين وشحن بوسطة", "shot": "لقطة واحدة متصلة بكاميرا موبايل: معتز واقف قدام مكتب الطباعة وفي الخلفية الطابعات شغالة. بعدها لقطة قريبة لشاشة اللابتوب على mujassam.net. الطلب لازم يكون لعميل حقيقي وافق على التصوير، وبياناته (الاسم والعنوان والرقم) متغطية."}, {"time": "0:20-1:10", "say": "العميل بدأ من الموقع. فتح mujassam.net، ورفع ملف الـ STL بتاعه، وظهرتله القطعة قدامه مجسمة على الشاشة. لف فيها بإيده وبصّ عليها من كل ناحية قبل ما يقرر أي حاجة. بعد كده اختار الخامة والجودة واللون، والسعر اتغير قدامه على طول مع كل اختيار.", "on_screen": "الرفع ثم المعاينة ثم السعر", "shot": "تسجيل شاشة حقيقي للموقع: رفع الملف، معاينة الـ 3D وتدويرها، تغيير الخامة والجودة واللون، والسعر بيتحدث. لو العميل موافق، لقطة جانبية ليده على الماوس. يتصور من الموقع نفسه من غير أي مونتاج للأرقام."}, {"time": "1:10-1:50", "say": "بعد ما السعر النهائي ظهر، العميل سجّل بحسابه وكمل للدفع. الدفع عندنا أونلاين قبل الطباعة، يا إنستاباي يا فودافون كاش يا فيزا، فاختار الطريقة اللي تريحه. أول ما الدفع تم، الطلب نزل عندنا في لوحة التشغيل.", "on_screen": "الدفع أونلاين قبل الطباعة", "shot": "تسجيل شاشة لصفحة اختيار طريقة الدفع (من غير إظهار أي بيانات دفع أو أرقام كروت)، وبعدها لقطة لشاشة لوحة الإدارة والطلب ظاهر فيها. يتغطى أي اسم أو رقم تليفون أو عنوان."}, {"time": "1:50-2:50", "say": "دلوقتي الدور على الطابعة. الملف اتحط على الطابعة المناسبة وبدأت تبني القطعة طبقة فوق طبقة. وأول ما خلصت، مفيش حاجة بتتشحن على طول. بنطلعها ونفحصها بإيدينا ونبص على شكلها كويس، وبعدين نغلفها. اللي بتشوفه ده هو نفس اللي هيوصل للعميل.", "on_screen": "طباعة ثم فحص ثم تغليف", "shot": "لقطات حقيقية بالتتابع: لقطة قريبة للطابعة وهي بتبني القطعة (تايم لابس لو الطباعة طويلة)، فصل القطعة من السطح، إزالة الدعامات لو فيه، فحصها بالإيد قدام الكاميرا، لفها وتغليفها ووضعها في الكرتونة. يتصور بالطلب الحقيقي نفسه."}, {"time": "2:50-3:35", "say": "بعد التغليف، الطلب بيتسلّم لبوسطة، والعميل بياخد رقم تتبع. من الصفحة دي يقدر يشوف الطلب وصل لفين خطوة بخطوة، من غير ما يتصل بحد ولا يسأل. والمهم إني مش هقولك هيوصل إمتى بالظبط، لأن ده بيعتمد على المحافظة وعلى بوسطة، لكن التتبع قدامه طول الطريق.", "on_screen": "تتبع بوسطة لحظة بلحظة", "shot": "لقطة لتسليم الكرتونة لمندوب بوسطة أو لإيصال الشحن، وبعدها تسجيل شاشة لصفحة التتبع وحالة الشحنة بتتغير (تغطية بيانات العميل). لو الطلب لسه في الطريق وقت التصوير، تتصور الحالة الحالية زي ما هي من غير تعديل."}, {"time": "3:35-4:25", "say": "ووصلنا للجزء اللي مستنيينه. الكرتونة وصلت للعميل، وهنفتحها معاه. شيل الغلاف، وطلّع القطعة، وشوفها بعينك: الشكل، والألوان، والتفاصيل، وحطها جنب الصورة اللي كانت على الشاشة وقت المعاينة. وبعد ما يشوفها، نسمع رأيه بصراحة.", "on_screen": "فتح الكرتونة وشكل القطعة", "shot": "لقطة Unboxing حقيقية من جنب أو من فوق، بعميل حقيقي موافق على التصوير، أو حد من الفريق لو العميل رفض الظهور. لقطة قريبة جداً للقطعة من كل زاوية، وبعدها لقطة بجانب شاشة المعاينة. لو العميل قال رأيه بصوته نسجله زي ما هو من غير كتابة كلام عنه."}, {"time": "4:25-4:50", "say": "ده كان طلب واحد من أوله لآخره: رفع، معاينة، سعر، دفع، طباعة، فحص، تغليف، شحن، وفتح كرتونة. لو عندك ملف STL ومحتاج تطبعه، الموقع في الكابشن وتحت الفيديو. ارفع ملفك وشوف السعر قبل ما تقرر.", "on_screen": "mujassam.net", "shot": "لقطة مباشرة لمعتز بيتكلم للكاميرا وجنبه القطعة اللي اتفتحت، وبعدها لقطة ثابتة للوجو واللينك على خلفية كحلي #142D4E وبرتقالي #E87932."}]}}, {"id": 17, "platform": "إنستجرام", "format": "ريل", "title": "شوف قطعتك 3D قبل ما تدفع", "summary": "عندك ملف جاهز؟ تعالى أوريك إزاي ترفع ملف STL وتعرف السعر قبل ما تدفع أي جنيه.", "date": "2026-11-07", "script": {"hook": "عندك ملف جاهز؟ تعالى أوريك إزاي ترفع ملف STL وتعرف السعر قبل ما تدفع أي جنيه.", "caption": "ارفع ملف STL واعرف السعر قبل ما تدفع، وشوف قطعتك 3D قدامك الأول. بتختار الخامة والجودة بنفسك، ويظهرلك السعر ووقت الطباعة قبل الدفع من غير ما حد يكلم حد. اللينك في البايو، ومعاك ملف؟ جرّبه دلوقتي.", "hashtags": ["#طباعة_3d_اونلاين", "#طباعة_ثلاثية_الأبعاد", "#مجسم", "#3dprintingegypt"], "scenes": [{"time": "0-3 ث", "say": "عندك ملف جاهز؟ تعالى أوريك إزاي ترفع ملف STL وتعرف السعر قبل ما تدفع أي جنيه.", "on_screen": "ارفع ملف STL واعرف السعر", "shot": "تسجيل شاشة لصفحة مجسّم الرئيسية على الموبايل أو اللابتوب، وإيد صاحب النشاط بتشاور على مكان الرفع. صوت المتكلم فوق التسجيل."}, {"time": "3-9 ث", "say": "أنا نزلت حامل موبايل من Printables، وهسحبه على الموقع زي ما هو.", "on_screen": "اسحب الملف وخلاص", "shot": "تسجيل شاشة حقيقي: ملف حامل الموبايل بيتسحب من فولدر التحميلات لمكان الرفع، وشريط الرفع بيتحرك."}, {"time": "9-16 ث", "say": "أول حاجة بتظهر القطعة ثلاثية الأبعاد قدامي، بلفها وأبصلها من كل ناحية. لو فيها حاجة مش عاجباني، أعرف قبل ما أكمل.", "on_screen": "شوف القطعة قبل الطباعة", "shot": "تسجيل شاشة لمعاينة الـ3D والماوس بيلف القطعة ويقرّب عليها من أكتر من زاوية."}, {"time": "16-24 ث", "say": "بعدها أختار الخامة والجودة واللون، وكل ما أغيّر حاجة السعر بيتغير قدامي على طول.", "on_screen": "الخامة والجودة واللون", "shot": "تسجيل شاشة وهو بيبدّل بين PLA وPETG ويغيّر الجودة واللون، مع تقريب (zoom) على الرقم وهو بيتغير."}, {"time": "24-32 ث", "say": "وفي الآخر يظهرلي السعر ووقت الطباعة، وده اللي هدفعه. من غير مكالمة ولا رسايل، ولا إني أستنى حد يرد.", "on_screen": "السعر ووقت الطباعة قبل الدفع", "shot": "تسجيل شاشة لصفحة ملخص الطلب بالسعر النهائي ووقت الطباعة، وإيد بتقرّب من زرار الدفع من غير ما تدوس عليه."}, {"time": "32-37 ث", "say": "لو عندك ملف زي ده، جرّبه بنفسك. اللينك في البايو.", "on_screen": "اللينك في البايو", "shot": "لقطة قريبة لصاحب النشاط ماسك قطعة مطبوعة حقيقية من شغلنا (حامل الموبايل لو اتطبع) وبيبتسم للكاميرا، وبعدها لقطة ثابتة لشعار مجسّم."}]}}, {"id": 15, "platform": "يوتيوب", "format": "فيديو قصير", "title": "سباق: طلب طباعة بالطريقة التقليدية ضد مجسّم", "summary": "عندك ملف وعايز طباعة 3d بدون واتساب وبدون ما تستنى حد يرد؟ تعالى نعمل سباق.", "date": "2026-11-04", "script": {"hook": "عندك ملف وعايز طباعة 3d بدون واتساب وبدون ما تستنى حد يرد؟ تعالى نعمل سباق.", "caption": "طباعة 3d بدون واتساب ولا انتظار تسعير: سباق بين طلب بالطريقة التقليدية وطلب على مجسّم بنفس الملف. ارفع ملفك على mujassam.net وشوف السعر النهائي قبل ما تدفع. وإنت شايف الفرق، قولنا هتجرب بأنهي ملف؟", "hashtags": ["#طباعة_3d_اونلاين", "#طباعة_3d_مصر", "#مجسم"], "scenes": [{"time": "0-3 ث", "say": "عندك ملف وعايز طباعة 3d بدون واتساب وبدون ما تستنى حد يرد؟ تعالى نعمل سباق.", "on_screen": "طباعة 3d بدون واتساب", "shot": "شاشة منقسمة نصين. على الشمال موبايل عليه شات مع مطبعة (حساب تجريبي بتاعنا، من غير اسم أو لوجو لأي حد). على اليمين لابتوب مفتوح على mujassam.net. تايمر شغال فوق في النص. الاتنين بيبدأوا بنفس ملف STL (حامل موبايل بسيط)."}, {"time": "3-12 ث", "say": "على الشمال بنكلم المطبعة ونبعت الملف ونستنى. وعلى اليمين رفعت نفس الملف على مجسّم وفتح قدامي معاينة 3D للقطعة.", "on_screen": "شمال: إرسال وانتظار | يمين: رفع ومعاينة", "shot": "لقطة قريبة للموبايل وإيد بتبعت الملف وعلامة «تم الإرسال» من غير رد. على اليمين الملف بيتسحب على الموقع وتظهر المعاينة 3D وبيلف بإيدك. التصوير screen recording حقيقي مع لقطة للإيدين."}, {"time": "12-24 ث", "say": "لسه الشمال مستني التسعير، وبعدها هييجي نقاش في السعر والخامة. وعلى اليمين اخترت الخامة والجودة واللون وظهر السعر النهائي قبل ما أدفع.", "on_screen": "سعر نهائي قبل الدفع", "shot": "الشمال: الشات ثابت وعلامات الكتابة ظاهرة والموبايل على الترابيزة وإيد بتلمسه من وقت للتاني. اليمين: screen recording لاختيار الخامة والجودة واللون وظهور السعر النهائي ووقت الطباعة. التايمر ماشي في النص."}, {"time": "24-33 ث", "say": "وصلت لمرحلة الدفع على مجسّم، والطرف التاني لسه بيتفاهم على السعر. الفرق مش في السرعة بس، الفرق إن كل حاجة قدامك وإنت اللي ماسك الخطوات.", "on_screen": "رفع ← معاينة ← سعر ← دفع", "shot": "اليمين: شاشة الدفع (InstaPay / فودافون كاش / فيزا) وإيد بتختار طريقة الدفع. وقف التايمر على اللقطة دي. الشمال: نفس الشات لسه من غير سعر نهائي. بعدين قطع للقطعة المطبوعة الجاهزة على الترابيزة."}, {"time": "33-38 ث", "say": "عندك ملف STL؟ ارفعه على موقع مجسّم وشوف السعر قبل ما تدفع.", "on_screen": "mujassam.net", "shot": "لقطة واحدة وش للكاميرا (المالك أو حد من الفريق) ماسك القطعة المطبوعة، وبعدها شاشة بلوجو مجسّم ولينك الموقع بألوان البراند (كحلي وبرتقالي على أوف وايت)."}]}}, {"id": 14, "platform": "تيك توك", "format": "فيديو قصير", "title": "معاك 3D Model ومش معاك طابعة؟ ده الحل", "summary": "لقيت ملف عاجبك ومعاكش طابعة؟ تعالى أوريك تطبع ملف STL من غير طابعة إزاي.", "date": "2026-11-04", "script": {"hook": "لقيت ملف عاجبك ومعاكش طابعة؟ تعالى أوريك تطبع ملف STL من غير طابعة إزاي.", "caption": "ازاي تطبع ملف STL من غير طابعة؟ تنزّل التصميم اللي عجبك، ترفعه على mujassam.net، وتشوف السعر النهائي قبل ما تدفع. الرابط في البايو.", "hashtags": ["#طباعة_3d_اونلاين", "#طباعة_3d_مصر", "#مجسم"], "scenes": [{"time": "0-3 ث", "say": "لقيت ملف عاجبك ومعاكش طابعة؟ تعالى أوريك تطبع ملف STL من غير طابعة إزاي.", "on_screen": "معاك ملف ومعاكش طابعة؟", "shot": "تصوير شاشة موبايل أو لابتوب وإيد الشخص بتتصفح تصاميم على MakerWorld. بعدها لقطة قريبة على تصميم عاجبه (قطعة واضحة زي حامل موبايل) وهو بيضغط تحميل. الصوت صوت حقيقي بتعليق صاحب ال const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let filter = "";
function plain(i){
  const s=i.script; if(!s) return i.title+"\n"+i.summary;
  const out=[];
  if(s.caption||s.hashtags.length) out.push("الكابشن:",[s.caption,s.hashtags.join(" ")].filter(Boolean).join("\n"),"");
  if(s.hook) out.push("الهوك:",s.hook,"");
  const lines=s.scenes.map(x=>String(x.say||"").trim()).filter(Boolean);
  if(lines.length) out.push("السكريبت:",...lines);
  return out.join("\n").trim();
}
function card(i){
  const s=i.script;
  return `<article class="card" id="i${i.id}">
    <div class="chips"><span class="chip g">#${i.id}</span><span class="chip">${esc(i.platform)}</span><span class="chip g">${esc(i.format)}</span></div>
    <h2>${esc(i.title)}</h2>
    ${s?`<div class="hook">${esc(s.hook)}</div>`:`<p>${esc(i.summary)}</p>`}
    ${s?`<details><summary>السكريبت كامل</summary>
      ${s.scenes.map(x=>`<div class="scene"><div class="t">${esc(x.time)}</div><div>
        <div>${esc(x.say)}</div>
        ${x.on_screen?`<div><span class="lbl">على الشاشة: </span>${esc(x.on_screen)}</div>`:""}
        ${x.shot?`<div><span class="lbl">اللقطة: </span>${esc(x.shot)}</div>`:""}</div></div>`).join("")}
      ${s.caption?`<div class="cap">${esc(s.caption)}</div>`:""}
      ${s.hashtags.length?`<div class="tags">${s.hashtags.map(esc).join(" ")}</div>`:""}
    </details>
    <div class="actions"><button class="copy" type="button" data-id="${i.id}">📋 انسخ السكريبت</button></div>`:""}
  </article>`;
}
function draw(){
  const items = IDEAS.filter(i=>!filter||i.platform===filter);
  document.getElementById("list").innerHTML = items.length ? items.map(card).join("") : '<p class="empty">مفيش أفكار هنا لسه.</p>';
  const plats=[...new Set(IDEAS.map(i=>i.platform))];
  document.getElementById("bar").innerHTML = ["",...plats].map(p=>`<button data-p="${esc(p)}" class="${p===filter?"on":""}">${p?esc(p):"الكل"}</button>`).join("");
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.p!==undefined){filter=b.dataset.p;draw();}
  if(b.dataset.id){const i=IDEAS.find(x=>x.id==b.dataset.id); if(i) copyText(plain(i), b);}
});
function fallbackCopy(text){
  const ta=document.createElement("textarea"); ta.value=text; ta.setAttribute("readonly","");
  ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
  let ok=false; try{ok=document.execCommand("copy");}catch(e){} ta.remove(); return ok;
}
function copyText(text, b){
  const label="📋 انسخ السكريبت";
  const done=ok=>{b.textContent=ok?"✓ اتنسخ":"مقدرتش أنسخ، جرّب تاني"; b.classList.toggle("done",ok);
    setTimeout(()=>{b.textContent=label; b.classList.remove("done");},1800);};
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>done(true)).catch(()=>done(fallbackCopy(text)));
  } else done(fallbackCopy(text));
}
draw();
function openHash(){
  const el = location.hash && document.getElementById(location.hash.slice(1));
  if(!el) return;
  const d = el.querySelector("details"); if(d) d.open = true;
  el.scrollIntoView({block:"start"});
}
window.addEventListener("hashchange", openHash);
openHash();
</script>
