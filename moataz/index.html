<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>معتز — خاص</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--muted:#6b7280;--line:#e6e2d9;--accent:#e8702a;--accent-soft:#fdf0e7;--navy:#1f2f4d;--good:#2f7d5b;--bad:#b4541a}
@media (prefers-color-scheme:dark){:root{--bg:#12161f;--card:#1b212d;--ink:#e9ecf2;--muted:#9aa3b2;--line:#2a3242;--accent:#f08a4b;--accent-soft:#2b2119;--navy:#9db4dd;--good:#5fbf92;--bad:#f0a36b}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;line-height:1.7}
.wrap{max-width:980px;margin:0 auto;padding:28px 16px 60px}
h1{margin:0;font-size:1.6rem;color:var(--navy)}
.muted{color:var(--muted)}
#lock{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:12px}
#lock input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
.primary{border:0;background:var(--navy);color:var(--bg);border-radius:10px;padding:10px 14px;font-weight:600}
#err{color:var(--bad);min-height:1.4em;margin:0}
.tabs,.bar{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 14px}
.tabs button,.bar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 14px}
.tabs button.on,.bar button.on{background:var(--navy);color:var(--bg);border-color:var(--navy)}
input.search{font:inherit;width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;font-size:.8rem}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 10px;font-weight:600}
.chip.g{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:400}
.chip.approved{background:transparent;border:1px solid var(--good);color:var(--good)}
.chip.rejected{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.card h2{font-size:1.1rem;margin:8px 0 4px}
.hook{border-right:3px solid var(--accent);padding:2px 12px;margin:10px 0;font-weight:600}
.lbl{color:var(--muted);font-size:.85rem}
details{margin-top:8px} summary{cursor:pointer;color:var(--navy);font-weight:600}
.scene{border-top:1px dashed var(--line);padding:8px 0;display:grid;grid-template-columns:72px 1fr;gap:4px 12px}
.t{color:var(--accent);font-weight:700;font-size:.9rem}
.cap{background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:8px;white-space:pre-wrap}
.copy{margin-top:10px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:6px 16px;font-weight:600}
.copy.done{background:var(--accent);color:var(--card)}
.row{padding:10px 0;border-bottom:1px solid var(--line)} .row:last-child{border-bottom:0}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ghost{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:4px 12px}
@media (max-width:560px){.scene{grid-template-columns:1fr}}
</style>
</head>
<body>

    <button class="primary" type="submit" id="go">افتح</button>
    <p id="err"></p>
  </form>
  <div id="app" hidden></div>
</div>

async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(BLOB.salt), iterations:BLOB.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(BLOB.iv)}, key, b64(BLOB.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
document.getElementById("lock").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err"), go = document.getElementById("go");
  err.textContent = ""; go.disabled = true; go.textContent = "بيفتح...";
  try { D = await unlock(document.getElementById("pw").value); document.getElementById("pw").value = "";
        document.getElementById("lock").hidden = true; document.getElementById("app").hidden = false; draw(); }
  catch(_) { err.textContent = "الباسورد غلط."; }
  finally { go.disabled = false; go.textContent = "افتح"; }
});
let D = null, tab = "ideas", status = "", q = "";
const ST = {new:"جديدة", approved:"معتمدة", rejected:"مرفوضة"};
const list = v => Array.isArray(v) ? v.map(x => typeof x === "string" ? x : JSON.stringify(x)) : (v ? [String(v)] : []);
function copyText(i){
  const s=i.script; const out=[];
  if(s.caption||s.hashtags.length) out.push("الكابشن:",[s.caption,s.hashtags.join(" ")].filter(Boolean).join("\n"),"");
  if(s.hook) out.push("الهوك:",s.hook,"");
  const lines=s.scenes.map(x=>String(x.say||"").trim()).filter(Boolean);
  if(lines.length) out.push("السكريبت:",...lines);
  return out.join("\n").trim();
}
function fallbackCopy(text){const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();return ok;}
function doCopy(text,b){const done=ok=>{b.textContent=ok?"✓ اتنسخ":"مقدرتش أنسخ";b.classList.toggle("done",ok);
  setTimeout(()=>{b.textContent="📋 انسخ السكريبت";b.classList.remove("done")},1800)};
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(text).then(()=>done(true)).catch(()=>done(fallbackCopy(text)));
  else done(fallbackCopy(text));}
function ideaCard(i){
  const s=i.script;
  return `<article class="card">
    <div class="chips"><span class="chip g">#${i.id}</span><span class="chip ${esc(i.status)}">${esc(ST[i.status]||i.status)}</span>
      <span class="chip">${esc(i.platform)}</span><span class="chip g">${esc(i.format)}</span><span class="chip g">${esc(i.created)}</span></div>
    <h2>${esc(i.title)}</h2>
    <p style="margin:0">${esc(i.summary)}</p>
    ${i.reason?`<p class="lbl" style="margin:6px 0 0">سبب القرار: ${esc(i.reason)}</p>`:""}
    ${s&&s.hook?`<div class="hook">${esc(s.hook)}</div>`:""}
    <details><summary>التفاصيل والسكريبت</summary>
      ${i.why?`<p><span class="lbl">ليه: </span>${esc(i.why)}</p>`:""}
      ${list(i.warnings).length?`<p><span class="lbl">تنبيهات: </span>${list(i.warnings).map(esc).join(" · ")}</p>`:""}
      ${list(i.sources).length?`<p><span class="lbl">المصادر: </span>${list(i.sources).map(esc).join(" · ")}</p>`:""}
      ${s?s.scenes.map(x=>`<div class="scene"><div class="t">${esc(x.time)}</div><div><div>${esc(x.say)}</div>
        ${x.on_screen?`<div><span class="lbl">على الشاشة: </span>${esc(x.on_screen)}</div>`:""}
        ${x.shot?`<div><span class="lbl">اللقطة: </span>${esc(x.shot)}</div>`:""}</div></div>`).join(""):""}
      ${s&&s.caption?`<div class="cap">${esc(s.caption)}</div>`:""}
      ${s&&s.hashtags.length?`<div class="lbl">${s.hashtags.map(esc).join(" ")}</div>`:""}
    </details>
    ${s?`<button class="copy" type="button" data-copy="${i.id}">📋 انسخ السكريبت</button>`:""}
  </article>`;
}
const match = (...xs) => !q || xs.join(" ").toLowerCase().includes(q.toLowerCase());
function body(){
  if(tab==="ideas"){
    const items=D.ideas.filter(i=>(!status||i.status===status)&&match(i.title,i.summary,i.platform,i.reason));
    const counts=s=>D.ideas.filter(i=>!s||i.status===s).length;
    return `<div class="bar">${["","new","approved","rejected"].map(s=>`<button data-st="${s}" class="${s===status?"on":""}">${s?ST[s]:"الكل"} (${counts(s)})</button>`).join("")}</div>`+
      (items.length?items.map(ideaCard).join(""):'<p class="empty">مفيش نتايج.</p>');
  }
  if(tab==="keywords"){
    const rows=D.keywords.filter(k=>match(k.term,k.why,k.platforms));
    return `<div class="card">${rows.map(k=>`<div class="row"><div class="chips"><span class="chip ${esc(k.status)}">${esc(ST[k.status]||k.status)}</span><span class="chip g">${esc(k.kind)}</span>${k.platforms?`<span class="chip g">${esc(k.platforms)}</span>`:""}</div>
      <strong>${esc(k.term)}</strong>${k.why?`<div class="lbl">${esc(k.why)}</div>`:""}</div>`).join("")||'<p class="empty">مفيش.</p>'}</div>`;
  }
  if(tab==="lessons"){
    const rows=D.lessons.filter(l=>match(l.text));
    return `<div class="card">${rows.map(l=>`<div class="row">${esc(l.text)}<div class="lbl">${esc(l.origin)} · ${esc(l.ts)}</div></div>`).join("")||'<p class="empty">مفيش.</p>'}</div>`;
  }
  if(tab==="knowledge"){
    const rows=D.knowledge.filter(k=>match(k.category,k.topic,k.content));
    return `<div class="card">${rows.map(k=>`<div class="row"><div class="chips"><span class="chip g">${esc(k.category)}</span></div>
      <strong>${esc(k.topic)}</strong><div style="white-space:pre-wrap">${esc(k.content)}</div><div class="lbl">${esc(k.source)}</div></div>`).join("")||'<p class="empty">مفيش.</p>'}</div>`;
  }
  const rows=D.competitors.filter(c=>match(c.name,c.notes,c.links));
  return `<div class="card">${rows.map(c=>`<div class="row"><strong>${esc(c.name)}</strong> <span class="lbl">${esc(c.status)}</span>
    ${c.notes?`<div>${esc(c.notes)}</div>`:""}${c.links?`<div class="lbl" style="direction:ltr;text-align:right">${esc(c.links)}</div>`:""}</div>`).join("")||'<p class="empty">مفيش.</p>'}</div>`;
}
const TABS=[["ideas","الأفكار"],["keywords","الكلمات المفتاحية"],["lessons","الدروس"],["knowledge","المعرفة"],["competitors","المنافسين"]];
function draw(){
  document.getElementById("app").innerHTML = `<div class="top"><div><h1>معتز</h1><div class="muted">آخر تحديث ${esc(D.stamp)} · قراءة بس</div></div>
    <button class="ghost" type="button" id="close">اقفل</button></div>
    <div class="tabs">${TABS.map(([k,v])=>`<button data-tab="${k}" class="${k===tab?"on":""}">${v}</button>`).join("")}</div>
    <input class="search" id="q" placeholder="دوّر..." value="${esc(q)}" aria-label="بحث">
    <div id="body" style="margin-top:12px">${body()}</div>`;
}
document.addEventListener("input", e => { if(e.target.id==="q"){ q=e.target.value; document.getElementById("body").innerHTML=body(); }});
document.addEventListener("click", e => {
  const b=e.target.closest("button"); if(!b||!D) return;
  if(b.id==="close"){ D=null; document.getElementById("app").innerHTML=""; document.getElementById("app").hidden=true; document.getElementById("lock").hidden=false; return; }
  if(b.dataset.tab){ tab=b.dataset.tab; q=""; draw(); }
  else if(b.dataset.st!==undefined){ status=b.dataset.st; draw(); }
  else if(b.dataset.copy){ const i=D.ideas.find(x=>x.id==b.dataset.copy); if(i&&i.script) doCopy(copyText(i), b); }
});
</script>
</body>
</html>
